services:
  - type: web
    name: civicon-2026-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: EMAIL_DELIVERY_MODE
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: ALLOWED_ORIGINS
        sync: https://example.com
      - key: CLIENT_URL
        sync: https://example.com
      - key: MONGODB_URI
        sync: mongodb+srv://civicon2026:EkmId1nvVbPFUqet@cluster0.dlgcgsh.mongodb.net/avcoe-civil-conference?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_SECRET
        sync: civicon-2026-super-secure-jwt-key-rotate-this-before-production
      - key: ADMIN_EMAIL
        sync: admin@civicon2026.com
      - key: ADMIN_PASSWORD
        sync: admin@123
      - key: SMTP_USER
        sync: civicon2026@gmail.com
      - key: SMTP_PASS
        sync: kcfyhhkuaigdwqkw
      - key: MAIL_FROM
        sync: CIVICON 2026 <civicon2026@gmail.com>
    disk:
      name: civicon-uploads
      mountPath: /var/data
      sizeGB: 1
